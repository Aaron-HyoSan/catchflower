<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080">
<title>01 로그인</title>
<rect width="1000" height="1080" fill="#ffffff"/>
<rect x="55" y="115" width="377" height="814" rx="30" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><rect x="203.5" y="122" width="80" height="5" rx="3" fill="#ececec" stroke="none" stroke-width="1" opacity="1.0"/><text x="82" y="143" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">9:41</text><rect x="353" y="138.0" width="3" height="6.0" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="358" y="135.8" width="3" height="8.2" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="363" y="133.6" width="3" height="10.4" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="368" y="131.4" width="3" height="12.600000000000001" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><path d="M 379 138 a 7 7 0 0 1 11 0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><rect x="397" y="131" width="20" height="10" rx="2.5" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="1.0"/><rect x="399" y="133" width="14" height="6" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><circle cx="243.5" cy="266" r="52" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/><circle cx="243.5" cy="246.5" r="15.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="262.0456020677555" cy="259.97416860968855" r="15.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="254.96181241970322" cy="281.77583139031145" r="15.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="232.03818758029678" cy="281.77583139031145" r="15.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="224.9543979322445" cy="259.97416860968855" r="15.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="243.5" cy="266" r="9.672" fill="none" stroke="#dcdcdc" stroke-width="1"/><text x="243.5" y="362" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="-0.5">캐치플라워</text><text x="243.5" y="392" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">산책길에 만난 꽃, 사진으로 모으는 나만의 꽃 도감</text><rect x="76" y="616" width="335" height="54" rx="27.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="648.58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">카카오로 3초 만에 시작하기</text><rect x="76" y="682" width="335" height="54" rx="27.0" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><text x="243.5" y="714.58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15.5" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">애플로 시작하기</text><rect x="76" y="748" width="335" height="54" rx="27.0" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><text x="243.5" y="780.58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15.5" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">휴대폰 번호로 시작하기</text><text x="243.5" y="836" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">시작하면 이용약관과 개인정보 처리방침에</text><text x="243.5" y="851" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">동의한 것으로 봅니다.</text><text x="243.5" y="872" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">이용약관   ·   개인정보 처리방침</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="321.5" cy="240" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="321.5" y="244" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="643" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="647" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="775" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="779" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="351.5" cy="872" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="351.5" y="876" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 01</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">스플래시 · 로그인</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">앱 최초 실행 → 로그인 → 02 지역 선택</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">로고 · 태그라인</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">태그라인은 '게임'보다 '기록'을 앞세운다. 40~50대에게 게임이라는</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 단어는 진입 장벽. 로고는 꽃 심볼+워드마크 조합, 세로형.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">1순위 로그인 = 카카오</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">타깃 연령대 가입 이탈이 가장 적은 경로. 버튼 높이 54px, 폰트 15</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">.5pt 이상 고정.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">휴대폰 번호 로그인 필수</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">연락처 기반 친구 연결(기획서 10장)이 전화번호를 쓰므로, 소셜 로</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">그인만 두면 번호 미보유 계정이 생겨 친구 매칭이 깨진다. 가입 후</text><text x="517" y="399" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 번호 인증을 반드시 받는다.</text><circle cx="500" cy="420" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="424" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="425" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">약관 동의 방식</text><text x="517" y="441" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">체크박스를 두지 않고 '시작하면 동의' 방식. 단, 연락처·위치·카</text><text x="517" y="456" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">메라는 각 기능 최초 진입 시 별도 동의(화면 03).</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">01 스플래시 · 로그인</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">온보딩</text>
</svg>
