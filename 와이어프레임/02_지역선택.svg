<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080">
<title>02 지역 선택</title>
<rect width="1000" height="1080" fill="#ffffff"/>
<rect x="55" y="115" width="377" height="814" rx="30" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><rect x="203.5" y="122" width="80" height="5" rx="3" fill="#ececec" stroke="none" stroke-width="1" opacity="1.0"/><text x="82" y="143" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">9:41</text><rect x="353" y="138.0" width="3" height="6.0" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="358" y="135.8" width="3" height="8.2" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="363" y="133.6" width="3" height="10.4" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="368" y="131.4" width="3" height="12.600000000000001" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><path d="M 379 138 a 7 7 0 0 1 11 0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><rect x="397" y="131" width="20" height="10" rx="2.5" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="1.0"/><rect x="399" y="133" width="14" height="6" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="56" y="160" width="375" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><line x1="56" y1="212" x2="431" y2="212" stroke="#ededed" stroke-width="1"/><path d="M 83 178 L 74 186 L 83 194" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="243.5" y="191" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">활동 지역 선택</text><text x="411" y="191" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#6b6b6b" text-anchor="end" opacity="1.0" letter-spacing="0">1/2</text><text x="76" y="242" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">어느 동네에서 활동하세요?</text><text x="76" y="268" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">같은 동네 이웃들과 꽃 수집 순위를 겨루게 됩니다.</text><text x="76" y="286" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">가입 후에는 6개월에 한 번만 변경할 수 있어요.</text><rect x="76" y="320" width="335" height="48" rx="10" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><circle cx="100" cy="344" r="7" fill="none" stroke="#6b6b6b" stroke-width="1.6"/><line x1="105" y1="349" x2="110" y2="354" stroke="#6b6b6b" stroke-width="1.6"/><text x="120" y="349" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">동 이름으로 검색 (예: 연남동)</text><rect x="76" y="384" width="335" height="46" rx="23.0" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><text x="243.5" y="412.04" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">현재 위치로 우리 동네 찾기</text><text x="76" y="454" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">검색 결과</text><rect x="76" y="468" width="335" height="58" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><circle cx="97" cy="497" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="97" cy="497" r="4.5" fill="#333333" stroke="none" stroke-width="1"/><text x="115" y="502" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="122" y="494" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">서울특별시 마포구 연남동</text><text x="122" y="512" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">이웃 1,284명 활동 중</text><rect x="76" y="534" width="335" height="58" rx="10" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><circle cx="97" cy="563" r="9" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/><text x="115" y="568" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="122" y="560" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">서울특별시 마포구 연희동</text><text x="122" y="578" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">이웃 942명 활동 중</text><rect x="76" y="600" width="335" height="58" rx="10" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><circle cx="97" cy="629" r="9" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/><text x="115" y="634" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="122" y="626" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">서울특별시 서대문구 연희동</text><text x="122" y="644" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">이웃 771명 활동 중</text><rect x="76" y="666" width="335" height="58" rx="10" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><circle cx="97" cy="695" r="9" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/><text x="115" y="700" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="122" y="692" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">서울특별시 성동구 성수동1가</text><text x="122" y="710" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">이웃 1,530명 활동 중</text><rect x="76" y="732" width="335" height="58" rx="10" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><circle cx="97" cy="761" r="9" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/><text x="115" y="766" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="122" y="758" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">부산광역시 해운대구 우동</text><text x="122" y="776" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">이웃 1,102명 활동 중</text><rect x="56" y="820" width="375" height="108" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><line x1="56" y1="820" x2="431" y2="820" stroke="#ededed" stroke-width="1"/><rect x="76" y="838" width="335" height="54" rx="27.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="870.58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">연남동으로 시작하기</text><text x="243.5" y="906" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">선택한 동네는 2027년 2월 4일부터 변경할 수 있어요.</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="415" cy="346" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="350" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="384" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="388" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="480" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="484" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="865" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="869" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><circle cx="391.5" cy="906" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="391.5" y="910" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 02</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">활동 지역 선택</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">로그인 완료 → 지역 선택 → 03 권한 안내</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">동 단위 검색</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">행정동 기준. '연희동'처럼 동명이 중복되는 케이스가 실제로 많아</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">시·구를 항상 함께 표기해야 오등록을 막는다.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">현재 위치로 찾기</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">직접 타이핑이 어려운 사용자용 보조 경로. 위치 권한 1회성 요청.</text><circle cx="500" cy="333" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="337" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="338" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이웃 활동 인원 표시</text><text x="517" y="354" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">빈 동네를 고르면 랭킹이 무의미해지므로 인원을 미리 보여준다. 인</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">원 0~9명이면 '아직 이웃이 적어요' 안내 문구로 대체.</text><circle cx="500" cy="390" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="394" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="395" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">CTA에 선택 지역명 삽입</text><text x="517" y="411" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">선택 전에는 disabled 상태 + 문구 '동네를 선택해 주세요'.</text><circle cx="500" cy="432" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="436" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="517" y="437" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">변경 제한 사전 고지</text><text x="517" y="453" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">6개월 제한(기획서 9장)은 가입 시점에 날짜로 명시해야 CS 문의가</text><text x="517" y="468" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">줄어든다. 가입일 + 6개월을 실제 날짜로 계산해 표기.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">02 활동 지역 선택</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">온보딩</text>
</svg>
