ext x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">연락처 기반 연결(기획서 10장) 외에 지도에서 만난 사람도 친구가</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">될 수 있어야 지역 커뮤니티가 형성된다. 상호 수락 방식.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">꽃 정보 → 도감 링크</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">남의 기록에서 본 꽃을 내 도감(미발견 상태)으로 연결. 수집 목표</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">전환 동선.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">좋아요 · 댓글</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 8장. 아이콘 단독 대신 '좋아요 12' 텍스트 병기 — 타깃 인</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">지율 우선.</text><circle cx="500" cy="405" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="409" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="410" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">댓글 입력 · 신고</text><text x="517" y="426" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">MVP 운영 최소 요건: 신고(헤더 우측) + 차단. 댓글 신고 정책은 별</text><text x="517" y="441" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">도 문서 필요.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">16 꽃 기록 상세</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fil