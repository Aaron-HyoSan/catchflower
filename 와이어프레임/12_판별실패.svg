<rect x="55" y="115" width="377" height="814" rx="30" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><rect x="203.5" y="122" width="80" height="5" rx="3" fill="#ececec" stroke="none" stroke-width="1" opacity="1.0"/><text x="82" y="143" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">9:41</text><rect x="353" y="138.0" width="3" height="6.0" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="358" y="135.8" width="3" height="8.2" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="363" y="133.6" width="3" height="10.4" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="368" y="131.4" width="3" height="12.600000000000001" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><path d="M 379 138 a 7 7 0 0 1 11 0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><rect x="397" y="131" width="20" height="10" rx="2.5" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="1.0"/><rect x="399" y="133" width="14" height="6" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="56" y="160" width="375" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><line x1="56" y1="212" x2="431" y2="212" stroke="#ededed" stroke-width="1"/><path d="M 83 178 L 74 186 L 83 194" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="243.5" y="191" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0"></text><circle cx="243.5" cy="306" r="44" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="5 4"/><text x="243.5" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="34" font-weight="700" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">?</text><text x="243.5" y="394" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">어떤 꽃인지 알 수 없었어요</text><text x="243.5" y="422" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">다시 한 번 찍어 주시겠어요?</text><rect x="76" y="462" width="335" height="168" rx="14" fill="#f4f4f4" stroke="none" stroke-width="1" opacity="1.0"/><text x="94" y="492" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이렇게 찍으면 잘 알아봐요</text><circle cx="102" cy="518" r="3" fill="#6b6b6b" stroke="none" stroke-width="1"/><text x="114" y="522" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">꽃 한 송이가 화면에 꽉 차게</text><circle cx="102" cy="544" r="3" fill="#6b6b6b" stroke="none" stroke-width="1"/><text x="114" y="548" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">그림자 없는 밝은 곳에서</text><circle cx="102" cy="570" r="3" fill="#6b6b6b" stroke="none" stroke-width="1"/><text x="114" y="574" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">정면이나 살짝 위에서</text><circle cx="102" cy="596" r="3" fill="#6b6b6b" stroke="none" stroke-width="1"/><text x="114" y="600" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">흔들리지 않게 잠시 멈춰서</text><rect x="76" y="652" width="335" height="120" rx="12" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3" opacity="1.0"/><line x1="76" y1="652" x2="411" y2="772" stroke="#e0e0e0" stroke-width="1"/><line x1="411" y1="652" x2="76" y2="772" stroke="#e0e0e0" stroke-width="1"/><text x="243.5" y="716.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">내가 찍은 사진</text><text x="243.5" y="731.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">이 사진은 저장되지 않았어요</text><rect x="76" y="768" width="335" height="56" rx="28.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="801.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">다시 찍기</text><rect x="76" y="836" width="335" height="50" rx="25.0" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="243.5" y="866.4" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="500" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">나중에 할게요</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="381.5" cy="394" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="381.5" y="398" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="536" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="540" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="712" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="716" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="796" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="800" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 12</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">AI 판별 실패</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">08 분석 실패 → 재촬영(07) 또는 이탈</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">실패는 사용자 잘못이 아니게</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'인식 실패' 같은 시스템 어투 금지. '알 수 없었어요' + 부탁 형태</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">로 재시도를 유도.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">재촬영 팁 4개</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">실패 화면의 실질 기능. 기획서 5장은 '다시 촬영하도록 안내'만 규</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">정 → 구체 팁을 이 화면에 추가 정의.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">실패 사진 미저장 명시</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">촬영물이 어딘가 남는다는 불안을 차단.</text><circle cx="500" cy="390" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="394" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="395" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">3회 연속 실패 시 (분기)</text><text x="517" y="411" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'꽃이 아닐 수도 있어요' 문구로 교체 + 도감 홈 복귀 유도. 무한 재</text><text x="517" y="426" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">시도 루프 방지.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">12 AI 판별 실패</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
</svg>
