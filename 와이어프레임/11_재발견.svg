x="258.0476849942387" cy="386.02317061077997" r="19.8" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="228.9523150057613" cy="386.02317061077997" r="19.8" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="219.96135122169494" cy="358.35182938922003" r="19.8" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="243.5" cy="366" r="12.276" fill="none" stroke="#dcdcdc" stroke-width="1"/><text x="243.5" y="462" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">장미</text><rect x="76" y="498" width="335" height="118" rx="14" fill="#f4f4f4" stroke="none" stroke-width="1" opacity="1.0"/><text x="94" y="526" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이번 발견 기록</text><text x="94" y="552" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">날짜</text><text x="393" y="552" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">2026. 6. 14. 토</text><text x="94" y="574" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">장소</text><text x="393" y="574" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">서울숲</text><text x="94" y="596" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">총 발견</text><text x="393" y="596" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">4회</text><rect x="76" y="634" width="335" height="60" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><text x="92" y="660" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이번 시즌 종수는 늘지 않아요</text><text x="92" y="679" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">같은 꽃은 한 종으로 계산해요. 사진은 도감에 쌓여요.</text><text x="76" y="710" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">지금까지 만난 장미</text><rect x="76.0" y="722" width="77.75" height="77.75" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3" opacity="1.0"/><line x1="76.0" y1="722" x2="153.75" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><line x1="153.75" y1="722" x2="76.0" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><text x="114.875" y="764.875" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">NEW</text><rect x="161.75" y="722" width="77.75" height="77.75" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3" opacity="1.0"/><line x1="161.75" y1="722" x2="239.5" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><line x1="239.5" y1="722" x2="161.75" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><text x="200.625" y="764.875" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0"></text><rect x="247.5" y="722" width="77.75" height="77.75" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3" opacity="1.0"/><line x1="247.5" y1="722" x2="325.25" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><line x1="325.25" y1="722" x2="247.5" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><text x="286.375" y="764.875" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0"></text><rect x="333.25" y="722" width="77.75" height="77.75" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3" opacity="1.0"/><line x1="333.25" y1="722" x2="411.0" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><line x1="411.0" y1="722" x2="333.25" y2="799.75" stroke="#e0e0e0" stroke-width="1"/><text x="372.125" y="764.875" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0"></text><rect x="76" y="768" width="335" height="56" rx="28.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="801.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">지도에 공유하기</text><rect x="76" y="836" width="335" height="50" rx="25.0" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="243.5" y="866.4" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="500" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">나만 보기</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="375.5" cy="256" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="375.5" y="260" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="556" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="560" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="636" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="640" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="716" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="720" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 11</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">기존 꽃 재발견</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">09 네, 맞아요 → (이미 보유) → 13 공유 설정</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">재발견 문구 = 기획서 원문</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'장미를 다시 발견했어요! / 이번이 네 번째 발견입니다.' 서수(네</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">번째)로 표기 — '4회째'보다 타깃 가독성이 높다. 11번째 이상은 '</text><text x="517" y="285" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">열한 번째'까지 한글, 이후 '12번째'.</text><circle cx="500" cy="306" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="310" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="311" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이번 발견 기록 요약</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">날짜·장소·누적 횟수(기획서 5장 누적 항목). 위치 권한 거부 시</text><text x="517" y="342" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">장소 행은 숨김.</text><circle cx="500" cy="363" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="367" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="368" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">시즌 점수 미증가 안내</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">여기서 설명하지 않으면 '점수가 안 올랐다'는 CS로 직결. 규칙(기획</text><text x="517" y="399" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">서 11장)을 실패가 아니라 사진이 쌓이는 이득으로 프레이밍한다.</text><circle cx="500" cy="420" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="424" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="425" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">누적 사진 스트립</text><text x="517" y="441" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">같은 꽃을 다시 찍을 이유를 시각화. 최신 사진에 NEW 표시, 탭하면</text><text x="517" y="456" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 전체 뷰어.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">11 기존 꽃 재발견</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
