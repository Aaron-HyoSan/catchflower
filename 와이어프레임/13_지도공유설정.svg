<title>13 공유 설정</title>
<rect width="1000" height="1080" fill="#ffffff"/>
<rect x="55" y="115" width="377" height="814" rx="30" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><rect x="203.5" y="122" width="80" height="5" rx="3" fill="#ececec" stroke="none" stroke-width="1" opacity="1.0"/><text x="82" y="143" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">9:41</text><rect x="353" y="138.0" width="3" height="6.0" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="358" y="135.8" width="3" height="8.2" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="363" y="133.6" width="3" height="10.4" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="368" y="131.4" width="3" height="12.600000000000001" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><path d="M 379 138 a 7 7 0 0 1 11 0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><rect x="397" y="131" width="20" height="10" rx="2.5" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="1.0"/><rect x="399" y="133" width="14" height="6" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="56" y="160" width="375" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><line x1="56" y1="212" x2="431" y2="212" stroke="#ededed" stroke-width="1"/><path d="M 83 178 L 74 186 L 83 194" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="243.5" y="191" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">지도에 공유하기</text><text x="76" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이 꽃을 지도에 공유할까요?</text><text x="76" y="262" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">공유하면 다른 사람이 이 장소에서 꽃을 찾아볼 수 있어요.</text><rect x="76" y="286" width="335" height="88" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><rect x="88" y="298" width="64" height="64" rx="8" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3" opacity="1.0"/><line x1="88" y1="298" x2="152" y2="362" stroke="#e0e0e0" stroke-width="1"/><line x1="152" y1="298" x2="88" y2="362" stroke="#e0e0e0" stroke-width="1"/><text x="120.0" y="334.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">사진</text><text x="164" y="320" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">장미</text><text x="164" y="342" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">2026. 6. 14. · 4번째 발견</text><text x="76" y="394" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">발견 장소</text><rect x="76" y="406" width="335" height="66" rx="12" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><path d="M 102 428 a 9 9 0 1 1 0.1 0 L 102 452 Z" fill="none" stroke="#333333" stroke-width="1.6"/><text x="124" y="436" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">서울숲</text><text x="124" y="456" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">성동구 성수동1가 · 정확한 위치는 공개되지 않아요</text><text x="395" y="446" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="700" fill="#6b6b6b" text-anchor="end" opacity="1.0" letter-spacing="0">변경</text><text x="76" y="494" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">누구에게 보여줄까요?</text><rect x="76" y="508" width="335" height="62" rx="12" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><circle cx="99" cy="539" r="9" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="99" cy="539" r="4.5" fill="#333333" stroke="none" stroke-width="1"/><text x="117" y="544" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="124" y="536" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">모두에게 공개</text><text x="124" y="555" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">지도를 보는 누구나 볼 수 있어요</text><rect x="76" y="578" width="335" height="62" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><circle cx="99" cy="609" r="9" fill="#ffffff" stroke="#c8c8c8" stroke-width="1.5"/><text x="117" y="614" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"></text><text x="124" y="606" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13.5" font-weight="400" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">친구에게만 공개</text><text x="124" y="625" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">연락처로 연결된 친구만 볼 수 있어요</text><text x="76" y="654" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">한 줄 남기기 (안 써도 돼요)</text><rect x="76" y="666" width="335" height="62" rx="12" fill="#ffffff" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="90" y="692" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">예: 숲길 끝 벤치 옆에 활짝 피었어요</text><text x="397" y="716" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">0 / 40</text><rect x="56" y="810" width="375" height="118" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><line x1="56" y1="810" x2="431" y2="810" stroke="#ededed" stroke-width="1"/><rect x="76" y="828" width="335" height="56" rx="28.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="861.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">공유하기</text><text x="243.5" y="902" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">공유하지 않기</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="415" cy="330" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="334" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="422" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="426" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="522" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="526" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="670" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="674" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><circle cx="305.5" cy="902" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="305.5" y="906" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 13</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">지도 공유 설정</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">10/11 지도에 공유하기 → 설정 → 14 지도</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">공유 대상 확인 카드</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">무엇을 공유하는지 사진·이름·날짜로 재확인. 오공유 취소 문의를</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 줄인다.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">장소는 이름 단위로만</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 7장: 좌표 대신 장소명. '정확한 위치는 공개되지 않아요'를</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 상시 노출해 집 근처 촬영 시 거부감을 없앤다. '변경'으로 인근 장</text><text x="517" y="342" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">소 후보 재선택.</text><circle cx="500" cy="363" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="367" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="368" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">공개 범위 2택</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기본값 '모두에게 공개'. 단, 계정 지역과 촬영 위치가 다른 시·군</text><text x="517" y="399" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">·구면 기본값을 '친구에게만'으로 낮추는 안을 검토(집 위치 노출</text><text x="517" y="414" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">방지).</text><circle cx="500" cy="435" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="439" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="440" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">한 줄 설명은 선택</text><text x="517" y="456" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 8장. 라벨 자체에 '안 써도 돼요'를 넣어 필수로 오해하지 않</text><text x="517" y="471" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">게. 40자 제한.</text><circle cx="500" cy="492" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="496" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="517" y="497" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">공유하지 않기 = 텍스트 버튼</text><text x="517" y="513" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">도감 등록은 이미 끝난 상태(기획서 8장). 탭하면 05 도감 상세로 이</text><text x="517" y="528" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">동하며 '도감에는 저장됐어요' 토스트.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">13 지도 공유 설정</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
</svg>
