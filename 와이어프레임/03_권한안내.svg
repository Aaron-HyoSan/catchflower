<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080">
<title>03 권한 안내</title>
<rect width="1000" height="1080" fill="#ffffff"/>
<rect x="55" y="115" width="377" height="814" rx="30" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><rect x="203.5" y="122" width="80" height="5" rx="3" fill="#ececec" stroke="none" stroke-width="1" opacity="1.0"/><text x="82" y="143" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">9:41</text><rect x="353" y="138.0" width="3" height="6.0" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="358" y="135.8" width="3" height="8.2" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="363" y="133.6" width="3" height="10.4" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="368" y="131.4" width="3" height="12.600000000000001" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><path d="M 379 138 a 7 7 0 0 1 11 0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><rect x="397" y="131" width="20" height="10" rx="2.5" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="1.0"/><rect x="399" y="133" width="14" height="6" rx="1" fill="#1a1a1a" stroke="none" stroke-width="1" opacity="1.0"/><rect x="56" y="160" width="375" height="52" rx="0" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><line x1="56" y1="212" x2="431" y2="212" stroke="#ededed" stroke-width="1"/><path d="M 83 178 L 74 186 L 83 194" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><text x="243.5" y="191" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">권한 안내</text><text x="411" y="191" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="500" fill="#6b6b6b" text-anchor="end" opacity="1.0" letter-spacing="0">2/2</text><text x="76" y="242" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="21" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">이 세 가지만 허용하면 준비 끝!</text><text x="76" y="268" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">허용하지 않아도 도감은 쓸 수 있지만 일부 기능이 제한돼요.</text><rect x="76" y="302" width="335" height="104" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><rect x="92" y="320" width="42" height="42" rx="10" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="113" y="346" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">icon</text><text x="146" y="334" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">카메라</text><rect x="199" y="320" width="34.400000000000006" height="20" rx="10.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="216.2" y="334.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">필수</text><text x="146" y="356" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">꽃을 직접 촬영해 도감에 등록합니다.</text><text x="146" y="374" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">앨범 사진은 등록할 수 없어요.</text><rect x="351" y="322" width="44" height="26" rx="13.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><circle cx="382.0" cy="335.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="76" y="416" width="335" height="104" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><rect x="92" y="434" width="42" height="42" rx="10" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="113" y="460" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">icon</text><text x="146" y="448" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">위치</text><rect x="184" y="434" width="34.400000000000006" height="20" rx="10.0" fill="#ffffff" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="201.2" y="448.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">선택</text><text x="146" y="470" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">꽃을 발견한 장소를 지도에 남깁니다.</text><text x="146" y="488" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">끄면 지도 공유를 쓸 수 없어요.</text><rect x="351" y="436" width="44" height="26" rx="13.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><circle cx="382.0" cy="449.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="76" y="530" width="335" height="104" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><rect x="92" y="548" width="42" height="42" rx="10" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="113" y="574" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">icon</text><text x="146" y="562" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">연락처</text><rect x="199" y="548" width="34.400000000000006" height="20" rx="10.0" fill="#ffffff" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="216.2" y="562.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">선택</text><text x="146" y="584" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">이미 가입한 지인을 친구로 연결합니다.</text><text x="146" y="602" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="0">번호는 암호화해 보관하며 저장하지 않아요.</text><rect x="351" y="550" width="44" height="26" rx="13.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><circle cx="382.0" cy="563.0" r="10.0" fill="#ffffff" stroke="none" stroke-width="1"/><rect x="76" y="644" width="335" height="66" rx="12" fill="#f4f4f4" stroke="none" stroke-width="1" opacity="1.0"/><text x="92" y="670" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">촬영한 사진은 내 도감에만 저장됩니다.</text><text x="92" y="690" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">지도 공유는 매번 직접 선택해요.</text><rect x="76" y="820" width="335" height="54" rx="27.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="852.58" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">허용하고 시작하기</text><text x="243.5" y="894" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">나중에 설정에서 바꿀 수 있어요</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="415" cy="312" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="316" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="426" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="430" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="540" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="544" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="636" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="640" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 03</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">권한 안내</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">지역 선택 → 권한 → 04 도감 홈</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">카메라 = 필수, 토글 고정 ON</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">앱 카메라 직접 촬영이 게임 규칙의 근간(기획서 5장). 거부 시 촬영</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 진입마다 설정 유도 시트를 띄운다.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">위치 = 선택</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">거부해도 도감 등록은 가능하되 지도 공유 옵션이 사라진다. 이 경우</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 인증 완료 화면에서 공유 영역을 숨기고 '위치를 켜면 지도에 남길</text><text x="517" y="342" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 수 있어요' 배너.</text><circle cx="500" cy="363" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="367" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="368" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">연락처 = 선택 + 보안 문구</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 15장 보안 검토 항목. 원문 저장 없이 해시 매칭한다는 사실</text><text x="517" y="399" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">을 이 화면에서 명시해야 중장년 타깃 신뢰 확보에 유리.</text><circle cx="500" cy="420" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="424" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="425" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">프라이버시 안심 박스</text><text x="517" y="441" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'자동 공개가 아니다'를 가입 단계에서 못 박는다. 실제 공유는 화면</text><text x="517" y="456" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 13에서 매번 선택.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">03 권한 안내</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">온보딩</text>
</svg>
