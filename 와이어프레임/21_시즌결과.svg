,284명 중</text><circle cx="243.5" cy="360" r="54" fill="#ffffff" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="4 3"/><text x="243.5" y="364" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">배지</text><text x="243.5" y="440" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">봄꽃 수집가</text><text x="243.5" y="464" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">칭호를 받았어요</text><rect x="76" y="504" width="335" height="150" rx="14" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><text x="94" y="534" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">시즌 1 기록</text><text x="94" y="562" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">모은 꽃</text><text x="393" y="562" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">24종</text><text x="94" y="586" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">발견 횟수</text><text x="393" y="586" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">68회</text><text x="94" y="610" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">지도 공유</text><text x="393" y="610" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">19개</text><text x="94" y="634" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">최고 순위</text><text x="393" y="634" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">3위</text><rect x="76" y="672" width="335" height="78" rx="14" fill="#ffffff" stroke="none" stroke-width="1" opacity="1.0"/><text x="94" y="700" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">도감은 그대로 남아요</text><text x="94" y="720" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">모은 꽃 37종과 사진은 초기화되지 않아요.</text><text x="94" y="737" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">순위 점수만 새 시즌으로 리셋됩니다.</text><rect x="76" y="768" width="335" height="56" rx="28.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="801.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">시즌 2 시작하기</text><rect x="76" y="836" width="335" height="50" rx="25.0" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="243.5" y="866.22" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14.5" font-weight="500" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">결과 공유하기</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="351.5" cy="248" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="351.5" y="252" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="456" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="460" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="586" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="590" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="862" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="866" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 21</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">시즌 종료 결과</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">시즌 종료 후 최초 실행 → 결과 → 새 시즌</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">시즌 결과는 전면 화면</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">시즌 종료 후 첫 실행 시 1회 강제 노출. 기획서 11장 보상 지급 시</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">점.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">칭호 · 배지 수여</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'2026 시즌 1 연남동 꽃수집 1위' 같은 순위형과 '봄꽃 수집가' 같은</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 달성형 2계열. 4위는 순위형 미지급 → 달성형만 표시.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">초기화 범위 안내 (중요)</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 6·11장의 핵심 규칙. 여기서 명시하지 않으면 '내 꽃이 사라</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">졌다'는 오해가 시즌 전환 시점에 집중 발생한다.</text><circle cx="500" cy="405" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="409" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="410" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">결과 공유</text><text x="517" y="426" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">이미지 카드로 저장/외부 공유. 신규 유입 경로이자 초대 유인.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">21 시즌 종료 결과</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">랭킹</text>
</svg>
