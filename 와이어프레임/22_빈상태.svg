f" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">0종에서도 분모 노출</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'0 / 200종'을 보여줘 앞으로의 규모를 인지시킨다. 진행 바는 빈 상</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">태 유지.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">빈 상태 CTA</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">하단 촬영 버튼이 있어도 빈 화면에서는 큰 CTA를 한 번 더. 첫 촬영</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 전환이 온보딩 최종 관문.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">제철 추천 꽃 4종</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'무엇을 찍어야 하나'를 해결하는 장치. 현재 월 + 계정 지역 기준으</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">로 꽃 마스터 데이터에서 흔함(rarity=흔함) 종을 자동 추출. 200종</text><text x="517" y="399" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 데이터의 season/rarity 컬럼이 이 기능의 전제.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">22 빈 상태 (도감 0종)</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">도감</text>
