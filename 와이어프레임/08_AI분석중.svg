othic',sans-serif" font-size="14" font-weight="700" fill="#c0c0c0" text-anchor="middle" opacity="1.0" letter-spacing="0">취소</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="415" cy="415.5" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="419.5" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="361.5" cy="682" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="361.5" y="686" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="243.5" cy="868" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="243.5" y="872" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 08</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">AI 분석 중</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">07 촬영 → 분석 → 09 확인 / 12 실패</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">촬영 사진 즉시 노출</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">업로드 대기 중에도 자기가 찍은 사진이 보이면 체감 대기 시간이 짧</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">아진다.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">대기 문구는 소요 시간 명시</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'분석 중...' 대신 '5초 정도 걸려요'. 무응답 오해로 인한 이탈 방</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">지. 10초 초과 시 '조금 더 걸리고 있어요'로 교체.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">취소 가능</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">네트워크 지연 시 탈출구. 취소 시 사진은 서버에 저장하지 않는다.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">08 AI 분석 중</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
</svg>
