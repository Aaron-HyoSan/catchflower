"#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">이 꽃은</text><text x="243.5" y="526" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">장미</text><text x="243.5" y="554" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">인가요?</text><circle cx="243.5" cy="618" r="42" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/><circle cx="243.5" cy="602.25" r="12.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="258.47914013164865" cy="613.1329823385946" r="12.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="252.75761772360644" cy="630.7420176614054" r="12.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="234.24238227639356" cy="630.7420176614054" r="12.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="228.52085986835132" cy="613.1329823385946" r="12.6" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="243.5" cy="618" r="7.811999999999999" fill="none" stroke="#dcdcdc" stroke-width="1"/><text x="243.5" y="680" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">장미과 · 5~6월에 피는 꽃</text><rect x="76" y="704" width="335" height="56" rx="28.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="737.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">네, 맞아요</text><rect x="76" y="772" width="335" height="56" rx="28.0" fill="#ffffff" stroke="#333333" stroke-width="1.5" opacity="1.0"/><text x="243.5" y="805.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">아니에요, 다시 찍을게요</text><text x="243.5" y="856" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">비슷한 꽃 · 해당화, 찔레꽃</text><text x="243.5" y="876" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1.0" letter-spacing="0">다르면 다시 찍어 주세요</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="391" cy="190" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="391" y="194" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="311.5" cy="522" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="311.5" y="526" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="732" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="736" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="800" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="804" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><circle cx="335.5" cy="856" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="335.5" y="860" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 09</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">AI 판별 결과 확인</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">08 분석 → 확인 → 10 신규 / 11 재발견</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">촬영 사진 상단 고정</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">판정 대상과 결과를 한 화면에서 대조할 수 있어야 사용자가 판단 가</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">능.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">꽃 이름을 최대 크기로</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 5장 문안 '이 꽃은 장미인가요?'를 3줄로 쪼개 이름만 32pt.</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 노안 고려.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">긍정 버튼 = 네, 맞아요</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 원안 '맞아요'보다 응답형 '네, 맞아요'가 질문-대답 쌍으로</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 읽혀 오탭이 적다.</text><circle cx="500" cy="405" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="409" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="410" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">부정 버튼 = 재촬영 직행</text><text x="517" y="426" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 5장: 후보 목록은 제공하지 않는다. 탭 시 07 카메라로 즉시</text><text x="517" y="441" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 복귀.</text><circle cx="500" cy="462" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="466" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="517" y="467" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">비슷한 꽃 힌트</text><text x="517" y="483" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">오인식 빈발 종을 미리 보여 사용자가 스스로 걸러내게 한다. 오등록</text><text x="517" y="498" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 데이터가 도감에 쌓이는 것을 막는 저비용 장치.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">09 AI 판별 결과 확인</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
</svg>
