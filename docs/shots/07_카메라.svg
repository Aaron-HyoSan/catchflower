<rect x="55" y="115" width="377" height="814" rx="30" fill="#ffffff" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><rect x="203.5" y="122" width="80" height="5" rx="3" fill="#ececec" stroke="none" stroke-width="1" opacity="1.0"/><rect x="56" y="116" width="375" height="812" rx="30" fill="#2b2b2b" stroke="none" stroke-width="1" opacity="1.0"/><text x="82" y="143" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="start" opacity="1.0" letter-spacing="0">9:41</text><text x="243.5" y="190" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">꽃 촬영</text><text x="80" y="195" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="start" opacity="1.0" letter-spacing="0">닫기</text><text x="407" y="195" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="400" fill="#ffffff" text-anchor="end" opacity="1.0" letter-spacing="0">도움말</text><rect x="56" y="226" width="375" height="520" rx="0" fill="#3f3f3f" stroke="none" stroke-width="1" opacity="1.0"/><text x="243.5" y="486" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#8f8f8f" text-anchor="middle" opacity="1.0" letter-spacing="0">카메라 프리뷰</text><path d="M 114 374 L 114 344 L 144 344" fill="none" stroke="#ffffff" stroke-width="2.5"/><path d="M 343 344 L 373 344 L 373 374" fill="none" stroke="#ffffff" stroke-width="2.5"/><path d="M 373 573 L 373 603 L 343 603" fill="none" stroke="#ffffff" stroke-width="2.5"/><path d="M 144 603 L 114 603 L 114 573" fill="none" stroke="#ffffff" stroke-width="2.5"/><text x="243.5" y="322" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">꽃 한 송이를 네모 안에 꽉 채워 주세요</text><text x="243.5" y="637" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#c8c8c8" text-anchor="middle" opacity="1.0" letter-spacing="0">너무 멀면 잘 못 알아봐요</text><rect x="56" y="776" width="375" height="152" rx="0" fill="#1f1f1f" stroke="none" stroke-width="1" opacity="1.0"/><rect x="76" y="792" width="335" height="40" rx="10" fill="#333333" stroke="none" stroke-width="1" opacity="1.0"/><text x="243.5" y="817" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="700" fill="#e0e0e0" text-anchor="middle" opacity="1.0" letter-spacing="0">앨범 사진은 등록할 수 없어요. 직접 찍어 주세요.</text><circle cx="243.5" cy="892" r="40" fill="#ffffff" stroke="#7a7a7a" stroke-width="2"/><circle cx="243.5" cy="892" r="32" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/><text x="243.5" y="952" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">찍기</text><circle cx="126" cy="892" r="22" fill="#333333" stroke="none" stroke-width="1"/><text x="126" y="896" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="8.5" font-weight="400" fill="#e0e0e0" text-anchor="middle" opacity="1.0" letter-spacing="0">플래시</text><circle cx="361" cy="892" r="22" fill="#333333" stroke="none" stroke-width="1"/><text x="361" y="896" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="9" font-weight="400" fill="#e0e0e0" text-anchor="middle" opacity="1.0" letter-spacing="0">전환</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="371.5" cy="322" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="371.5" y="326" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="473.5" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="477.5" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="52" cy="812" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="52" y="816" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="305.5" cy="892" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="305.5" y="896" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 07</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">카메라 촬영</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">하단 중앙 촬영 버튼 → 카메라 → 08 분석 중</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">촬영 가이드 문구</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">AI 인식률은 피사체 크기에 직결된다. '꽃 한 송이를 네모 안에 꽉</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">채워'처럼 동작을 지시하는 문장으로 쓴다.</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">정사각 가이드 프레임</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">1:1 크롭 영역만 AI에 전송. 배경 노이즈를 줄여 오인식을 낮춘다.</text><circle cx="500" cy="333" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="337" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="338" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">앨범 차단 사전 고지</text><text x="517" y="354" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 5장 규칙. 앨범 버튼을 아예 두지 않고, 왜 없는지를 문구로</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 설명해야 '기능 고장'으로 오해하지 않는다.</text><circle cx="500" cy="390" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="394" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="395" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">셔터 지름 80px</text><text x="517" y="411" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">중장년 타깃 기준 최소 터치 영역. 좌우 보조 버튼은 44px.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">07 카메라 촬영</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
</svg>
