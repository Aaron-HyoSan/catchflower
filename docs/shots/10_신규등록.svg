e-width="1"/><circle cx="139.5" cy="326" r="2" fill="#c8c8c8" stroke="none" stroke-width="1"/><circle cx="347.5" cy="330" r="2" fill="#c8c8c8" stroke="none" stroke-width="1"/><circle cx="243.5" cy="374" r="74" fill="#fafafa" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/><circle cx="243.5" cy="346.25" r="22.2" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="269.8918183271905" cy="365.4247784060952" r="22.2" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="259.81104075111614" cy="396.4502215939048" r="22.2" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="227.18895924888386" cy="396.4502215939048" r="22.2" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="217.10818167280948" cy="365.4247784060952" r="22.2" fill="none" stroke="#dcdcdc" stroke-width="1"/><circle cx="243.5" cy="374" r="13.764" fill="none" stroke="#dcdcdc" stroke-width="1"/><text x="243.5" y="480" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0" letter-spacing="0">장미</text><rect x="213.5" y="494" width="84.72" height="26" rx="13.0" fill="#ffffff" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="255.86" y="511.0" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">37번째 꽃</text><rect x="76" y="546" width="335" height="96" rx="14" fill="#f4f4f4" stroke="none" stroke-width="1" opacity="1.0"/><text x="94" y="578" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">도감</text><text x="393" y="580" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">37 / 200종</text><text x="94" y="618" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">이번 시즌</text><text x="393" y="620" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="end" opacity="1.0" letter-spacing="0">13종 (+1)</text><rect x="76" y="658" width="335" height="52" rx="12" fill="#ffffff" stroke="#ececec" stroke-width="1" opacity="1.0"/><text x="92" y="689" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">연남동 순위 24위 → 21위</text><text x="395" y="689" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="700" fill="#6b6b6b" text-anchor="end" opacity="1.0" letter-spacing="0">보기</text><rect x="76" y="768" width="335" height="56" rx="28.0" fill="#333333" stroke="#333333" stroke-width="1" opacity="1.0"/><text x="243.5" y="801.76" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">지도에 공유하기</text><rect x="76" y="836" width="335" height="50" rx="25.0" fill="#f4f4f4" stroke="#c8c8c8" stroke-width="1" opacity="1.0"/><text x="243.5" y="866.4" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="15" font-weight="500" fill="#6b6b6b" text-anchor="middle" opacity="1.0" letter-spacing="0">나만 보기</text><path d="M 30 90 H 457 V 1268 H 30 Z M 86 116 H 401 A 30 30 0 0 1 431 146 V 898 A 30 30 0 0 1 401 928 H 86 A 30 30 0 0 1 56 898 V 146 A 30 30 0 0 1 86 116 Z" fill="#ffffff" fill-rule="evenodd" stroke="none"/><rect x="55" y="115" width="377" height="814" rx="30" fill="none" stroke="#8f8f8f" stroke-width="1.5" opacity="1.0"/><circle cx="383.5" cy="226" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="383.5" y="230" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><circle cx="415" cy="480" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="484" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><circle cx="415" cy="592" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="596" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><circle cx="415" cy="684" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="688" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><circle cx="415" cy="796" r="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="415" y="800" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#333333" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="491" y="124" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1.5">SCREEN 10</text><text x="491" y="150" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">신규 꽃 등록 완료</text><text x="491" y="176" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="1">흐름</text><text x="491" y="193" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">09 네, 맞아요 → (첫 발견) → 13 공유 설정 또는 05 상세</text><line x1="491" y1="217" x2="891" y2="217" stroke="#e8e8e8" stroke-width="1"/><circle cx="500" cy="234" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="238" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">1</text><text x="517" y="239" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">축하 문구 = 기획서 원문 유지</text><text x="517" y="255" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">'새로운 꽃을 발견했어요! / 장미가 도감에 등록되었습니다.' 2줄 구</text><text x="517" y="270" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">조 확정. 반짝임 파티클은 과하지 않게(0.6초, 1회).</text><circle cx="500" cy="291" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="295" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">2</text><text x="517" y="296" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">몇 번째 꽃인지 배지</text><text x="517" y="312" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">숫자가 늘어나는 감각이 수집형의 핵심 보상. 10·50·100번째는 특</text><text x="517" y="327" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">별 연출.</text><circle cx="500" cy="348" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="352" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">3</text><text x="517" y="353" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">도감 · 시즌 동시 갱신 표시</text><text x="517" y="369" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">신규 발견만 시즌 종수가 +1 된다는 규칙(기획서 11장)을 이 화면에</text><text x="517" y="384" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">서 학습시킨다.</text><circle cx="500" cy="405" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="409" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">4</text><text x="517" y="410" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">순위 변동 알림</text><text x="517" y="426" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">지역 랭킹 상승을 즉시 보여주는 것이 재방문 동기. 순위 변동이 없</text><text x="517" y="441" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">으면 이 행은 숨김.</text><circle cx="500" cy="462" r="9.5" fill="#333333" stroke="none" stroke-width="1"/><text x="500" y="466" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="1.0" letter-spacing="0">5</text><text x="517" y="467" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="12.5" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">공유는 항상 선택</text><text x="517" y="483" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0">기획서 8장. '나만 보기'를 회색 보조 버튼으로 두되 동등하게 누를</text><text x="517" y="498" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1.0" letter-spacing="0"> 수 있게. 탭하면 도감 상세(05)로 이동.</text><text x="52" y="64" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1.0" letter-spacing="1">캐치플라워 · 와이어프레임 v0.1</text><text x="52" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0" letter-spacing="0">10 신규 꽃 등록 완료</text><text x="956" y="86" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="end" opacity="1.0" letter-spacing="0">촬영·AI인증</text>
</svg>
